spring.application.name=login-monitoring-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/login_monitoring_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

security.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3VyZUpXVFNlY3JldEtleUZvckxvZ2luTW9uaXRvcmluZ1N5c3RlbQ==}
security.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
